<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Skills</title>
    <link rel="stylesheet" href="Skill.css">
</head>
<body>
    <header>
        <div class="navbar">
            <button class="menu-toggle" id="mobile-menu" aria-label="Toggle menu">
                <span class="bar"></span>
                <span class="bar"></span>

            </button>
            
            <div class="nav-links" id="nav-links">

    <main>
        <div class="top-section">
            <h2 class="title">Soft Skills</h2>
        </div>
        <div class="slider-container">
            
            <!-- HTML -->
            <div class="slider-item">
                <div class="icon">h1</div>
                <div class="name">HTML</div>
                <div class="track"><div class="thumb" style="left: 95%;"></div></div>
            </div>

            <!-- CSS -->
            <div class="slider-item">
                <div class="icon">.css</div>
                <div class="name">CSS</div>
                <div class="track"><div class="thumb" style="left: 91%;"></div></div>
            </div>

            <!-- Java Script -->
            <div class="slider-item">

                <div class="icon">dj</div>
                <div class="name">Django</div>
                <div class="track"><div class="thumb" style="left: 60%;"></div></div>
            </div>

            <div class="slider-item">
                <div class="icon">.sql</div>
                <div class="name">MySQL</div>
                <div class="track"><div class="thumb" style="left: 75%;"></div></div>

    </footer>

    <script>
        const mobileMenu = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-links');

        mobileMenu.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            mobileMenu.classList.toggle('open');
        });
    </script>
